; Plan B for the Module 6 panel: ESP8266 (Wemos D1 mini) + PxMatrix.
; Same panel, same 5 V supply, different controller and a different harness.
;
; The ESP8266 has one SPI data line, so the panel's six colour inputs are chained
; into one long shift register with five jumpers between the input and the output
; header. That is the whole trick - see README.md.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 160 MHz halves the flicker: PxMatrix refreshes from the CPU, it has no DMA.
board_build.f_cpu = 160000000L

; Pinned on purpose. The registry release is the last stable one; Git master has
; moved towards ESP32-only driver work this fallback does not need.
lib_deps =
    2dom/PxMatrix LED MATRIX library@1.8.2
    adafruit/Adafruit GFX Library

build_flags =
    -DPxMATRIX_COLOR_DEPTH=4
