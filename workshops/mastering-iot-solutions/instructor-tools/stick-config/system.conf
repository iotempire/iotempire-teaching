# IoTempower Workshop System Configuration
# ==========================================
# Configure workshop Wi-Fi and MQTT broker.
# Devices connect to the 2.4 GHz network (iotempire-b1300).
# Laptops connect to 5 GHz (iotempire-b1300-5g) or 2.4 GHz.

# Wi-Fi access point SSID for devices (2.4 GHz)
IOTEMPOWER_AP_NAME="iotempire-b1300"

# Wi-Fi password (consistent default across IoTempower course modules)
IOTEMPOWER_AP_PASSWORD="iotempire"

# Address of the MQTT broker
# Using "_gateway" automatically connects to the default gateway / router IP
IOTEMPOWER_MQTT_HOST="_gateway"
# Alternatively set explicit IP if running broker on a distinct server IP:
# IOTEMPOWER_MQTT_HOST="192.168.15.1"
